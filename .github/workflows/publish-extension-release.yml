name: Remove Obsolete Browser Extension ZIP Assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-extension-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-extension-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Remove public extension ZIP assets from v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu

          for name in             Fasto-Browser-Extension-v1.0.0.zip             Fasto-Browser-Extension-v1.0.0.zip.sha256
          do
            asset_id="$(
              gh release view v1.0.0                 --repo Tanzeel0Hussain/Fasto                 --json assets                 --jq ".assets[] | select(.name == \"$name\") | .id"
            )"

            if [ -n "$asset_id" ]; then
              gh api                 --method DELETE                 "repos/Tanzeel0Hussain/Fasto/releases/assets/$asset_id"
              echo "✅ Removed $name"
            else
              echo "ℹ️ $name is already absent"
            fi
          done

      - name: Verify extension ZIP assets are gone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          assets="$(
            gh release view v1.0.0               --repo Tanzeel0Hussain/Fasto               --json assets               --jq '.assets[].name'
          )"

          echo "$assets"

          if echo "$assets" | grep -Fq 'Fasto-Browser-Extension-v1.0.0.zip'; then
            echo "Extension ZIP still present"
            exit 1
          fi

          echo "✅ Public extension ZIP assets removed"
